name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:bundle

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studydocs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studydocs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studydocs_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/studydocs_ci?schema=public
      FRONTEND_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ci-only-random-secret-that-is-longer-than-32-characters
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      SUPABASE_STORAGE_BUCKET: studydocs-ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studydocs_ci?schema=public
      TEST_SUPABASE_URL: https://example.supabase.co
      TEST_SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      TEST_SUPABASE_STORAGE_BUCKET: studydocs-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run seed
        env:
          NODE_ENV: test
          ALLOW_SEED: 'true'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run build
